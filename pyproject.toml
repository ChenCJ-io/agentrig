[project]
name = "agentrig"
version = "0.1.0a0"
description = "The MCP-native test rig for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "AgentRig Contributors" }]
keywords = ["mcp", "agent", "testing", "regression", "llm", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "asgi-lifespan>=2.1",
]

[project.urls]
Homepage = "https://github.com/ChenCJ-io/agentrig"
Repository = "https://github.com/ChenCJ-io/agentrig"
Issues = "https://github.com/ChenCJ-io/agentrig/issues"
Changelog = "https://github.com/ChenCJ-io/agentrig/blob/main/CHANGELOG.md"

[project.scripts]
agentrig = "agentrig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrig"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agentrig"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
