[project]
name = "agentrig"
version = "0.2.0a0"
description = "The MCP-native test rig for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "AgentRig Contributors" }]
keywords = ["mcp", "agent", "testing", "regression", "llm", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "agent-client-protocol>=0.11,<0.12",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "mcp>=1.28,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema>=4.23",
    "asgi-lifespan>=2.1",
]

[project.urls]
Homepage = "https://github.com/ChenCJ-io/agentrig"
Repository = "https://github.com/ChenCJ-io/agentrig"
Issues = "https://github.com/ChenCJ-io/agentrig/issues"
Changelog = "https://github.com/ChenCJ-io/agentrig/blob/main/CHANGELOG.md"

[project.scripts]
agentrig = "agentrig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrig"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "agentrig/alembic.ini"
"migrations" = "agentrig/migrations"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
exclude = [
    "/web/.react-router",
    "/web/dist/server",
    "/web/node_modules",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agentrig"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
