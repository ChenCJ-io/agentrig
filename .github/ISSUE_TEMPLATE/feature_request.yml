name: Feature request / 功能建议
description: Propose a focused capability or improvement / 提议边界清晰的能力或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Large protocol or architecture changes should identify compatibility and security boundaries.

        请先描述用户问题，再提出实现方案。较大的协议或架构改动应说明兼容性与安全边界。
  - type: textarea
    id: problem
    attributes:
      label: Problem and user scenario / 问题与用户场景
      description: Who needs this, in which workflow, and what is blocked today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 期望结果
      description: Describe observable behavior and acceptance criteria, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach / 建议方案
      description: Optional API, UI, protocol, or workflow sketch.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
  - type: textarea
    id: impact
    attributes:
      label: Compatibility, security, and evidence impact / 兼容性、安全与证据影响
      description: Note migrations, permission changes, data retention, or rollback concerns.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查项
      options:
        - label: I searched existing issues and documentation / 我已搜索现有 Issue 和文档
          required: true
        - label: I described the problem independently of the solution / 我已独立描述问题而非只给实现
          required: true
